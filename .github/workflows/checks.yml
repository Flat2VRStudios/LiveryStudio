name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/audit-public.py
      - run: dotnet run --project LiveryStudio/Tests/LiveryStudio.Tests.csproj -c Release -- --portable
      - run: dotnet run --project LiveryStudio/WorkflowChecks/LiveryStudio.WorkflowChecks.csproj -c Release
      - run: dotnet run --project LiveryStudio/DraftChangeChecks/LiveryStudio.DraftChangeChecks.csproj -c Release
      # WinRT codec execution is checked on an interactive Windows desktop.
      # It did not complete on the hosted runner during release validation.
      - run: dotnet build LiveryStudio/ImageFileChecks/LiveryStudio.ImageFileChecks.csproj -c Release
        timeout-minutes: 3
      - run: dotnet run --project LiveryStudio/VehicleChecks/LiveryStudio.VehicleRegressionChecks.csproj -c Release -- --workspace "${{ runner.temp }}/vehicle-regression"
      - run: dotnet build LiveryStudio/Cli/LiveryStudio.Cli.csproj -c Release
      - run: ./scripts/run_build.ps1 -Project LiveryStudio/Native/Launcher.vcxproj -Action Build -Config Release -Platform x64
      - run: dotnet list LiveryStudio/Core/LiveryStudio.Core.csproj package --vulnerable --include-transitive
